# /etc/xroad/conf.d/local.ini on mgmt.gerege.mn (= mgmt.xroad.mn)
# No secrets — file is empty of credential overrides as of 2026-05-08.
# Backup encryption is left at the proxy.ini default (disabled); if it
# ever gets enabled here, the keyid will live on the server only.
[proxy-ui-api]
wsdl-validator-command = /usr/share/xroad/wsdlvalidator/bin/wsdlvalidator_wrapper.sh
